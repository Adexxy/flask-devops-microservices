image:
  repository: your-docker-repo
  tag: latest

env:
  tag: latest
  SECRET_KEY: "change-me"


namespace: flask-microservices  # Add this line

database:
  secretName: "rds-credentials"  # Matches the Terraform-created secret
  secretNamespace: "flask-microservices"    

services:
  user:
    port: 5001
  product:
    port: 5002
  order:
    port: 5003
  notification:
    port: 5004

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: microservices.local
      paths:
        - path: /user
          service: user
        - path: /product
          service: product
        - path: /order
          service: order
        - path: /notification
          service: notification

postgres:
  enabled: false
