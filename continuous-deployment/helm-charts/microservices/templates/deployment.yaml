{{- range $name, $svc := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
        - name: {{ $.Chart.Name }}
          image: "{{ $.Values.image.repository }}/{{ $name }}_service:{{ $.Values.image.tag | default "latest" }}"
          # image: "{{ $.Values.image.repository }}/{{ $name }}_service:{{ $.Values.image.tag | default $.Values.env.tag | default "latest" }}"
          {{- with .Values.database }}
          envFrom:
            - secretRef:
                name: {{ .secretName | default "rds-credentials" }}
          {{- else }}
          envFrom:
            - secretRef:
                name: "rds-credentials"
          {{- end }}
          env:
            # - name: SQLALCHEMY_DATABASE_URI
            #   value: "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST)/$(DB_NAME)"
            - name: SECRET_KEY
              value: "{{ $.Values.env.SECRET_KEY }}"
          ports:
            - containerPort: {{ $svc.port }}
          {{- if $svc.resources }}
          resources:
            {{- if $svc.resources.requests }}
            requests:
              cpu: {{ $svc.resources.requests.cpu | quote }}
              memory: {{ $svc.resources.requests.memory | quote }}
            {{- end }}
            {{- if $svc.resources.limits }}
            limits:
              cpu: {{ $svc.resources.limits.cpu | quote }}
              memory: {{ $svc.resources.limits.memory | quote }}
            {{- end }}
          {{- end }}
---
{{- end }}

